services:
  mongo:
    image: mongo:7
    volumes:
      - mediassist_mongo:/data/db
    ports:
      - "27017:27017"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      MONGODB_URI: mongodb://mongo:27017
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      - mongo
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mediassist_mongo:
