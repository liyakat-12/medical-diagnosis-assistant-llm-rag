<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register | MediAssist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="min-h-screen bg-emerald-50 text-slate-800">
  <header class="border-b border-emerald-100 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-3">
      <a href="/" class="flex items-center gap-3">
        <img src="/images/logo-mark.png" alt="MediAssist" class="h-10 w-10 rounded-xl object-cover" />
        <span class="text-xl font-extrabold text-slate-900">MediAssist</span>
      </a>
      <nav id="nav-actions" class="flex items-center gap-2"></nav>
    </div>
  </header>

  <main class="flex min-h-[calc(100vh-4.25rem)] items-center justify-center px-5 py-12">
    <form id="auth-form" data-mode="register" class="w-full max-w-md space-y-4 rounded-3xl bg-white p-8 shadow-sm" novalidate>
      <h1 class="text-2xl font-extrabold text-slate-900">Register</h1>
      <label class="block text-sm font-bold text-slate-600">
        Full name
        <input id="name" name="name" type="text" autocomplete="name" required class="mt-1.5 w-full rounded-2xl border border-emerald-100 bg-emerald-50/70 px-4 py-3 text-sm outline-none focus:border-teal-600 focus:ring-4 focus:ring-teal-600/15" />
      </label>
      <label class="block text-sm font-bold text-slate-600">
        Email
        <input id="email" name="email" type="email" autocomplete="email" required class="mt-1.5 w-full rounded-2xl border border-emerald-100 bg-emerald-50/70 px-4 py-3 text-sm outline-none focus:border-teal-600 focus:ring-4 focus:ring-teal-600/15" />
      </label>
      <label class="block text-sm font-bold text-slate-600">
        Password
        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="4" class="mt-1.5 w-full rounded-2xl border border-emerald-100 bg-emerald-50/70 px-4 py-3 text-sm outline-none focus:border-teal-600 focus:ring-4 focus:ring-teal-600/15" />
      </label>
      <p id="auth-error" class="hidden text-sm font-semibold text-rose-600"></p>
      <button type="submit" id="auth-submit" class="w-full rounded-full bg-teal-700 py-3 text-sm font-extrabold text-white hover:bg-teal-800">Create account</button>
      <p class="text-center text-sm text-slate-500">Already have an account? <a href="/login" class="font-bold text-teal-800">Login</a></p>
    </form>
  </main>
  <script src="/js/nav.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
