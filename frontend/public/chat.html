<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat | MediAssist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="h-screen overflow-hidden bg-emerald-50 text-slate-800">
  <header class="sticky top-0 z-20 border-b border-emerald-100 bg-white">
    <div class="flex items-center justify-between px-4 py-3">
      <div class="flex items-center gap-3">
        <button type="button" id="toggle-sidebar" class="rounded-xl border border-emerald-200 px-3 py-2 text-sm font-bold text-teal-800 lg:hidden">Menu</button>
        <a href="/" class="flex items-center gap-3">
          <img src="/images/logo-mark.png" alt="MediAssist" class="h-10 w-10 rounded-xl object-cover" />
          <span class="text-xl font-extrabold text-slate-900">MediAssist</span>
        </a>
      </div>
      <nav id="nav-actions" class="flex items-center gap-2"></nav>
    </div>
  </header>

  <div class="chat-shell relative flex">
    <aside id="sidebar" class="sidebar-closed absolute inset-y-0 left-0 z-10 flex w-72 flex-col border-r border-teal-900/20 bg-teal-900 text-white lg:static lg:translate-x-0">
      <div class="p-3">
        <button type="button" id="new-chat" class="w-full rounded-2xl bg-white/15 px-4 py-3 text-sm font-extrabold hover:bg-white/25">+ New chat</button>
      </div>
      <p class="px-4 pb-2 text-xs font-bold uppercase tracking-widest text-teal-200">History</p>
      <nav id="history" class="flex-1 space-y-1 overflow-y-auto px-2 pb-4"></nav>
    </aside>

    <section class="flex min-w-0 flex-1 flex-col">
      <div id="messages" class="flex-1 space-y-4 overflow-y-auto px-4 py-6 sm:px-8"></div>
      <form id="composer" class="border-t border-emerald-100 bg-white p-4">
        <div class="mx-auto max-w-3xl">
          <p class="text-xs font-extrabold uppercase tracking-widest text-slate-400">Select symptoms</p>
          <div id="symptom-picks" class="mt-2 flex flex-wrap gap-2"></div>
          <div class="mt-3 flex items-end gap-3">
            <label class="sr-only" for="query">Message</label>
            <textarea id="query" rows="1" placeholder="Describe your symptoms, or select them above…" class="max-h-40 min-h-[3rem] flex-1 resize-none rounded-2xl border border-emerald-100 bg-emerald-50/70 px-4 py-3 text-sm outline-none focus:border-teal-600 focus:ring-4 focus:ring-teal-600/15"></textarea>
            <button type="submit" id="send" class="rounded-full bg-teal-700 px-5 py-3 text-sm font-extrabold text-white hover:bg-teal-800">Send</button>
          </div>
          <p id="status" class="mt-2 hidden text-xs font-semibold text-slate-500"></p>
        </div>
      </form>
    </section>
  </div>

  <script src="/js/nav.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
