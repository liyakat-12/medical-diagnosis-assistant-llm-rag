name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      APP_ENV: development
      MONGODB_URI: memory
      JWT_SECRET: ci-test-secret-not-for-production-use
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build retrieval index
        run: python scripts/build_index.py general
      - name: Verify retrieval index
        run: python -c "import sys; from src.retrieval.retriever import retrieve; hits = retrieve('How can I prevent food poisoning at home?', mode='general'); print(f'retrieved {len(hits)} hits'); sys.exit(0 if hits else 'general index returned no hits')"
      - name: Run backend tests
        run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Run frontend tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
